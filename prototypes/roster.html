<title>Lanternfall Roster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;600&family=Pixelify+Sans:wght@400;600;700&display=swap">
<style>
:root {
  color-scheme: dark;
  --bg: #140F1A; --panel: #1F1827; --panel-2: #2A2233; --well: #110D16;
  --line: #3A2F47; --line-hi: #4E4060; --bone: #EFE6D6; --muted: #A597B4; --ember: #FF9E3D; --ink: #0B0810;
  --display: "Pixelify Sans", "Courier New", monospace;
  --body: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--bone); font: 14px/1.4 var(--body); }
.app { max-width: 1240px; margin: 0 auto; padding: 16px; }
h1 { margin: 0; font: 600 22px/1.1 var(--display); }
h2 { margin: 20px 0 8px; font: 600 14px var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
p.lede { margin: 6px 0 0; color: var(--muted); }
.stage { border: 2px solid var(--ink); outline: 2px solid var(--line-hi); background: #0e0b12; overflow-x: auto; }
.stage canvas { display: block; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 12px; }
.card { background: var(--panel); border: 2px solid var(--line); padding: 8px; min-width: 0; }
.head { display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: center; }
.pf { width: 58px; height: 66px; border: 3px solid; image-rendering: pixelated; background: #0e0b12; object-fit: cover; }
.nm b { display: block; font: 600 15px/1.15 var(--display); }
.nm small { color: var(--muted); }
.card canvas { display: block; width: 100%; margin-top: 6px; background: #0e0b12; }
.bio { margin: 6px 0 0; font-size: 12.5px; color: var(--muted); }
.q { margin: 2px 0 0; font-size: 12px; color: #d8c8a8; font-style: italic; }
@media (max-width: 420px) { .grid { grid-template-columns: 1fr; } .app { padding: 16px 16px; } }
</style>
<div class="app">
<h1>Roster</h1>
<p class="lede">All 18 companions from the real rig data (src/js/12-art-rigs.js) and baker (src/js/60b-baker.js). Line-up at 1x, then each card: idle and strike at 1x, idle and strike at 3x, and the portrait in its rarity frame.</p>
<h2>Battle scale (1x)</h2>
<div class="stage"><canvas id="lineup"></canvas></div>
<h2>Characters</h2>
<div class="grid" id="grid"></div>
</div>
<script src="../src/js/12-art-rigs.js"></script>
<script src="../src/js/21-stories.js"></script>
<script src="../src/js/60b-baker.js"></script>
<script>
'use strict';
const ROSTER = [
  ['tobin', 'Common'], ['wren', 'Common'], ['hesketh', 'Common'], ['pip', 'Common'], ['bram', 'Common'],
  ['maren', 'Rare'], ['aldric', 'Rare'], ['kestrel', 'Rare'], ['thessaly', 'Rare'], ['anselm', 'Rare'],
  ['grenna', 'Epic'], ['isolde', 'Epic'], ['oriel', 'Epic'], ['morwen', 'Epic'], ['vesper', 'Epic'],
  ['elowen', 'Legendary'], ['caedmon', 'Legendary'], ['corvin', 'Legendary']
];
const FRAME = typeof RARITY_FRAME !== 'undefined' ? RARITY_FRAME : { Common: '#A9B1BD', Rare: '#7FB2FF', Epic: '#B58CFF', Legendary: '#F2C14E' };
const frameCol = r => (FRAME[r] && FRAME[r].col) || FRAME[r] || FRAME[r.toLowerCase()] || '#888';

function paintBG(g, W, H, gy) {
  const gr = g.createLinearGradient(0, 0, 0, gy); gr.addColorStop(0, '#08121A'); gr.addColorStop(1, '#23485A'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
  g.fillStyle = '#12293A'; g.beginPath(); g.moveTo(0, gy); for (let x = 0; x <= W; x += 4) g.lineTo(x, gy - 26 + Math.sin(x * 0.02) * 6 + Math.sin(x * 0.05) * 3); g.lineTo(W, gy); g.fill();
  const gg = g.createLinearGradient(0, gy, 0, H); gg.addColorStop(0, '#16303A'); gg.addColorStop(1, '#0A141A'); g.fillStyle = gg; g.fillRect(0, gy, W, H - gy);
  g.fillStyle = '#2F5A55'; g.fillRect(0, gy, W, 1);
}
// draw a frame with feet at (x, y), scale z; returns its lights in canvas px
function put(g, f, x, y, z) {
  const dx = Math.round(x - f.ox * z), dy = Math.round(y - f.oy * z);
  g.imageSmoothingEnabled = false; g.drawImage(f.c, dx, dy, f.c.width * z, f.c.height * z);
  return f.lights.map(l => ({ x: dx + l.x * z, y: dy + l.y * z, rgb: l.rgb, pulse: l.pulse, size: l.size * z }));
}
function shadow(g, x, y, rx) { g.fillStyle = 'rgba(0,0,0,.45)'; g.beginPath(); g.ellipse(x, y + 1, rx, Math.max(2, rx / 5), 0, 0, 7); g.fill(); }

// ---- line-up ----
const lu = document.getElementById('lineup'), LW = 18 * 44 + 24, LH = 120;
lu.width = LW; lu.height = LH; lu.style.width = LW + 'px';
{
  const g = lu.getContext('2d'), gy = LH - 22; paintBG(g, LW, LH, gy);
  const lights = [];
  g.font = '600 9px "Pixelify Sans", monospace'; g.textAlign = 'center';
  ROSTER.forEach(([k], i) => {
    const set = charFrames(companionSpec(k)); const x = 30 + i * 44;
    if (!RIG.COMPANIONS[k]) { g.fillStyle = '#E0524F'; g.fillText('?', x, gy - 20); return; }
    shadow(g, x, gy, 11); lights.push(...put(g, set.idle0, x, gy, 1));
    g.fillStyle = 'rgba(239,230,214,.85)'; g.fillText(RIG.COMPANIONS[k].name, x, gy + 13);
  });
  charLightPass(g, lights, 0, 1);
}

// ---- cards ----
const grid = document.getElementById('grid');
for (const [k, rar] of ROSTER) {
  const c = RIG.COMPANIONS[k];
  const card = document.createElement('div'); card.className = 'card';
  const head = document.createElement('div'); head.className = 'head';
  const img = document.createElement('img'); img.className = 'pf'; img.alt = ''; img.style.borderColor = frameCol(rar);
  if (c) img.src = portraitURL(k);
  const nm = document.createElement('div'); nm.className = 'nm';
  nm.innerHTML = `<b>${c ? c.name : k} <span style="color:${frameCol(rar)};font-size:12px">${rar}</span></b><small>${c ? c.title : 'no rig yet'}</small>`;
  head.append(img, nm); card.append(head);
  const cv = document.createElement('canvas'); const W = 376, H = 272; cv.width = W; cv.height = H; card.append(cv);
  const g = cv.getContext('2d'), gy = H - 14; paintBG(g, W, H, gy);
  if (c) {
    const set = charFrames(companionSpec(k)), L = [];
    shadow(g, 22, gy, 10); L.push(...put(g, set.idle0, 22, gy, 1));
    shadow(g, 58, gy, 10); L.push(...put(g, set.strike, 58, gy, 1));
    shadow(g, 150, gy, 30); L.push(...put(g, set.idle0, 150, gy, 3));
    shadow(g, 290, gy, 30); L.push(...put(g, set.strike, 290, gy, 3));
    charLightPass(g, L, 0, 2);
  }
  const bio = typeof BIOS !== 'undefined' && BIOS[k];
  if (bio) { const p = document.createElement('p'); p.className = 'bio'; p.textContent = bio; card.append(p); }
  const qs = typeof QUOTES !== 'undefined' && QUOTES[k];
  if (qs) for (const q of qs) { const p = document.createElement('p'); p.className = 'q'; p.textContent = '"' + q + '"'; card.append(p); }
  grid.append(card);
}
document.body.dataset.ready = '1';
</script>

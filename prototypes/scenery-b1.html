<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scenery B1</title>
<style>
  :root { --bg: #140F1A; --ink: #0B0810; --panel: #1E1626; --line: #3A2C44; --text: #EFE6D6; --dim: #A89CB0; --ember: #FF9E3D; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
  header { padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; border-bottom: 1px solid var(--line); }
  h1 { font-size: 18px; margin: 0; color: var(--ember); }
  label { color: var(--dim); display: inline-flex; gap: 6px; align-items: center; }
  main { display: grid; grid-template-columns: repeat(auto-fill, 360px); gap: 12px; padding: 12px; justify-content: center; }
  figure { margin: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; width: 362px; }
  canvas { display: block; width: 360px; height: 250px; background: var(--ink); }
  figcaption { padding: 4px 10px; display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
  figcaption span { color: var(--dim); font-size: 12px; }
</style>
<header>
  <h1>Scenery, B1 with lanterns</h1>
  <label><input type="checkbox" id="anim" checked> Animate</label>
  <label><input type="checkbox" id="band" checked> Placeholder party</label>
</header>
<main id="grid"></main>
<script>
// Loads the shipping module itself. ?static=1 draws one frame (for screenshots), ?only=cave,marsh picks themes.
const s0 = document.createElement('script'); s0.src = '../src/js/63-scenery.js?v=' + Date.now();
s0.onload = () => start(); document.head.append(s0);
function start() {
  const Q = new URLSearchParams(location.search);
  const LIST = [
    ['forest', 'Mossy Hollow', 0], ['cave', 'Batwing Caves', 0], ['bone', 'The Bonefield', 0], ['barrow', 'Beetle Barrows', 0],
    ['fungal', 'Fungal Deep', 0], ['quarry', 'Quarry Ruins', 0], ['marsh', 'Wraithmarsh', 0], ['mine', 'Mine (ore)', 0],
    ['woods', 'Woods (wood)', 0], ['raid', 'World raid', 0],
    ['forest', 'Mossy Hollow II (+70)', 70], ['forest', 'Mossy Hollow III (+140)', 140], ['forest', 'Mossy Hollow IV (+210)', 210],
    ['bone', 'The Bonefield II (+70)', 70]
  ].filter(([k]) => !Q.get('only') || Q.get('only').split(',').includes(k));
  const W = 360, H = 250, DPR = +Q.get('dpr') || Math.min(window.devicePixelRatio || 1, 2);
  const grid = document.getElementById('grid');
  const cards = LIST.map(([key, name, hue]) => {
    const fig = document.createElement('figure');
    const cv = document.createElement('canvas'); cv.width = W * DPR; cv.height = H * DPR;
    const cap = document.createElement('figcaption'); cap.innerHTML = `<b>${name}</b><span></span>`;
    fig.append(cv, cap); grid.append(fig);
    const t0 = performance.now(), scene = sceneFor(key, W, H, hue), ms = performance.now() - t0;
    const vis = scene.lights.filter(l => l.x > 0 && l.x < W).length;
    cap.querySelector('span').textContent = `${ms.toFixed(0)} ms build · ${vis} lights`;
    return { cv, ctx: cv.getContext('2d'), scene };
  });
  // B1-sized placeholders: 35 art px at 2x, party columns and a foe where the stage puts them
  function people(g, sc, camX) {
    const GY = sc.GY, P = 2;
    const units = [[0.085, 34, '#3E63C9', 0], [0.215, 35, '#7A4AB8', 5], [0.345, 33, '#4E8A48', 0], [0.73, 30, '#6FCB6A', 0, 1]];
    for (const [fx, h, col, lane, foe] of units) {
      const x = Math.round(W * fx - camX), y = GY - lane, w = foe ? 16 : 11;
      g.fillStyle = 'rgba(0,0,0,.4)'; g.beginPath(); g.ellipse(x, y + 1, w * 1.1, 3, 0, 0, 7); g.fill();
      g.fillStyle = '#120B18'; g.fillRect(x - w - P, y - h * P - P, (w * 2) + 2 * P, h * P + P);
      g.fillStyle = col; g.fillRect(x - w, y - h * P, w * 2, h * P - P);
      if (!foe) { g.fillStyle = '#E8C9A8'; g.fillRect(x - 5, y - h * P + 6, 10, 10); }
    }
  }
  const stat = Q.get('static');
  let T = +(Q.get('t') || 3);
  function frame() {
    const camX = stat ? 0 : Math.sin(T * 0.25) * 8;
    for (const c of cards) {
      const g = c.ctx, sc = c.scene;
      g.setTransform(DPR, 0, 0, DPR, 0, 0); g.imageSmoothingEnabled = false;
      g.fillStyle = '#0B0810'; g.fillRect(0, 0, W, H);
      drawScene(g, sc, camX);
      if (document.getElementById('band').checked) people(g, sc, camX);
      drawScene(g, sc, camX, 'fg');
      drawAtmosphere(g, sc, T, W, H, camX);
    }
  }
  if (stat) { frame(); window.READY = true; return; }
  let last = performance.now();
  (function loop(now) { if (document.getElementById('anim').checked) T += Math.min(0.05, (now - last) / 1000); last = now; frame(); requestAnimationFrame(loop); })(last);
  window.READY = true;
}
</script>

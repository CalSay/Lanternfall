<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root {
  color-scheme: dark;
  --bg: #140F1A; --panel: #1F1827; --panel-2: #2A2233; --well: #110D16;
  --line: #3A2F47; --line-hi: #4E4060; --bone: #EFE6D6; --muted: #A597B4;
  --ember: #FF9E3D; --ember-deep: #B8621B; --gold: #F2C14E; --hp: #E0524F; --xp: #6FCB6A; --arcane: #B58CFF;
  --ink: #0B0810;
  --display: "Pixelify Sans", "Courier New", monospace;
  --body: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); }
.wrap {
  min-height: 100vh; background-color: var(--bg);
  background-image: radial-gradient(rgba(255,255,255,.028) 1px, transparent 1px); background-size: 4px 4px;
  color: var(--bone); font: 15px/1.4 var(--body); -webkit-tap-highlight-color: transparent;
}
.app { max-width: 420px; margin: 0 auto; padding: 12px 0 24px; }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
.head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 0 16px 8px; }
.head h1 { margin: 0; font: 600 19px/1.1 var(--display); text-shadow: 0 2px 0 var(--ink); }
.head span { font-size: 12px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.zone { display: flex; justify-content: space-between; align-items: baseline; padding: 0 16px 6px; font: 600 13px var(--display); color: var(--muted); }
.zone b { color: var(--bone); font-weight: 600; }
.stage { position: relative; height: 270px; margin: 0 16px; border: 2px solid var(--ink); outline: 2px solid var(--line-hi); overflow: hidden; background: #0e0b12; touch-action: manipulation; cursor: crosshair; user-select: none; -webkit-user-select: none; }
.stage canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
.controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px 16px 0; }
.btn { position: relative; overflow: hidden; display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 6px 10px; border: 2px solid var(--line-hi); background: var(--panel-2); box-shadow: 0 3px 0 var(--ink), inset 0 2px 0 rgba(255,255,255,.06); cursor: pointer; text-align: left; }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.btn .t { display: grid; line-height: 1.1; min-width: 0; }
.btn .t b { font: 600 15px var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn .t small { font-size: 11px; color: var(--muted); letter-spacing: .05em; text-transform: uppercase; }
.btn canvas { width: 30px; height: 30px; image-rendering: pixelated; flex: none; }
.btn .cd { position: absolute; inset: 0; pointer-events: none; background: conic-gradient(rgba(11,8,16,.72) calc(var(--cd, 0) * 360deg), transparent 0); }
.btn .cdn { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font: 700 18px var(--display); color: var(--bone); text-shadow: 0 2px 0 var(--ink); }
.ability { border-color: var(--ember); background: linear-gradient(#3a2530, #2a1a24); }
.ability.ready { box-shadow: 0 3px 0 var(--ink), 0 0 14px rgba(255,158,61,.35); }
.dodge { border-color: var(--line); opacity: .55; }
.dodge.live { opacity: 1; border-color: var(--hp); background: linear-gradient(#4a1c22, #2e1216); animation: pulse .32s steps(2) infinite; }
.dodge.live .t b { color: #FFD9D0; }
@keyframes pulse { 50% { box-shadow: 0 3px 0 var(--ink), 0 0 18px rgba(224,82,79,.7); } }
.classes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 10px 16px 0; }
.cls { display: grid; justify-items: center; gap: 2px; padding: 6px 2px 5px; border: 2px solid var(--line); background: var(--panel); box-shadow: 0 2px 0 var(--ink); cursor: pointer; font: 600 12px var(--display); color: var(--muted); }
.cls canvas { width: 32px; height: 32px; image-rendering: pixelated; }
.cls[aria-pressed="true"] { border-color: var(--ember); color: var(--bone); background: var(--panel-2); box-shadow: 0 2px 0 var(--ink), inset 0 0 0 1px rgba(255,158,61,.25); }
.label { padding: 14px 16px 6px; font: 600 12px var(--display); color: var(--muted); letter-spacing: .1em; text-transform: uppercase; }
.strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 0 16px; }
.tile { position: relative; display: grid; gap: 3px; padding: 5px 5px 6px; background: var(--panel); border: 2px solid var(--line); box-shadow: 0 2px 0 var(--ink); min-width: 0; }
.tile.hero { border-color: var(--ember-deep); background: linear-gradient(#2a1f2c, var(--panel)); }
.tile.hit { animation: tilehit .22s steps(2); }
@keyframes tilehit { 0% { transform: translateX(-2px); border-color: var(--hp); } 50% { transform: translateX(2px); } }
.tile .pt { position: relative; height: 38px; background: var(--well); border: 1px solid var(--ink); display: grid; place-items: center; overflow: hidden; }
.tile .pt canvas { width: 36px; height: 36px; image-rendering: pixelated; }
.tile .lv { position: absolute; right: 1px; bottom: 1px; background: var(--ember); color: #1A1420; font: 700 10px/1 var(--display); padding: 2px 3px; }
.tile .ri { position: absolute; left: 2px; top: 2px; width: 11px; height: 11px; image-rendering: pixelated; }
.tile .nm { font: 600 12px/1.1 var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .rl { font-size: 10px; color: var(--muted); letter-spacing: .05em; text-transform: uppercase; line-height: 1; }
.tile .bar { height: 6px; background: var(--well); border: 1px solid var(--ink); position: relative; }
.tile .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--hp); box-shadow: inset 0 2px 0 rgba(255,255,255,.25); transition: width .15s; }
.tile .bar i.tr { background: #FFF3E0; transition: width .45s ease-in .12s; }
.tile .hpn { font: 600 10px/1 var(--display); color: var(--muted); font-variant-numeric: tabular-nums; }
.note { padding: 14px 16px 0; font-size: 13px; color: var(--muted); }
.note b { color: var(--bone); font-weight: 600; }
@media (prefers-reduced-motion: reduce) {
  .dodge.live { animation: none; box-shadow: 0 3px 0 var(--ink), 0 0 14px rgba(224,82,79,.6); }
  .tile.hit { animation: none; border-color: var(--hp); }
  .tile .bar i, .tile .bar i.tr { transition: none; }
}
@media (max-width: 380px) { .stage { margin: 0 10px; } .controls, .classes, .strip { padding-left: 10px; padding-right: 10px; } .strip { gap: 4px; } }

function buildSprite(rows, pal, mode) {
  const w = Math.max(...rows.map(r => r.length)), h = rows.length;

  const c = document.createElement('canvas'); c.width = w + 2; c.height = h + 2;
  const g = c.getContext('2d');

  for (let y = -1; y <= h; y++) for (let x = -1; x <= w; x++) {
    if (on(x, y)) continue;
    if (on(x - 1, y) || on(x + 1, y) || on(x, y - 1) || on(x, y + 1)) g.fillRect(x + 1, y + 1, 1, 1);

  rows.forEach((r, y) => { for (let i = 0; i < r.length; i++) { if (!on(i, y)) continue; g.fillStyle = mode === 1 ? '#FFFFFF' : (pal[r[i]] || '#FF00FF'); g.fillRect(i + 1, y + 1, 1, 1); } });

    const ri = roleIcon(m.d.role); ri.className = 'ri'; pt.appendChild(ri);
    const lv = document.createElement('span'); lv.className = 'lv'; lv.textContent = 'L' + m.lvl; pt.appendChild(lv);
    const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = m.isHero ? m.d.name : m.d.name;
    const rl = document.createElement('div'); rl.className = 'rl'; rl.textContent = (m.isHero ? 'Hero ' : '') + m.d.role;
    const bar = document.createElement('div'); bar.className = 'bar'; const tr = document.createElement('i'); tr.className = 'tr'; const fi = document.createElement('i'); bar.append(tr, fi);
    const hpn = document.createElement('div'); hpn.className = 'hpn';
    el.append(pt, nm, rl, bar, hpn); strip.appendChild(el);
    tiles[i] = { el, fi, tr, hpn };
  });
}
function buildClasses() {
  const box = $('classes'); box.textContent = '';
  HEROES.forEach(k => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'cls'; b.setAttribute('aria-pressed', k === heroKey);
    b.appendChild(portrait(k)); b.appendChild(document.createTextNode(CHARS[k].name));
    b.addEventListener('click', () => { if (heroKey === k) return; heroKey = k; abilCd = 0; buildClasses(); setParty(); setAbility(); });
    box.appendChild(b);
  });
}
function setAbility() {
  const a = ABIL[heroKey]; $('abilName').textContent = a.name; $('abilSub').textContent = a.sub;
  const ic = { warden: ROLE_IC.tank, lanternmage: ROLE_IC.caster, ranger: ROLE_IC.striker, chaplain: ROLE_IC.support }[heroKey];
  iconCanvas(ic.rows, { w: '#0B0810', m: a.col, M: '#FFF3C4', t: '#F2C14E', b: '#8A5A3A', l: '#FFF3C4', L: '#FFFFFF' }, $('abilIc'));
}
function updateDodgeBtn() {
  const b = $('dodge'); b.classList.toggle('live', !!dodge);
  $('dodgeName').textContent = dodge ? 'Dodge!' : 'Parry'; $('dodgeSub').textContent = dodge ? 'Tap now' : 'Wait for the glow';
}
let uiAcc = 0;
function uiTick(dt) {
  const a = ABIL[heroKey]; const cdK = abilCd / a.cd;
  $('abilCd').style.setProperty('--cd', cdK.toFixed(3));
  $('abilN').textContent = abilCd > 0 ? Math.ceil(abilCd) : '';
  $('abil').classList.toggle('ready', abilCd <= 0);
  uiAcc += dt; if (uiAcc < 0.1) return; uiAcc = 0;
  party.forEach((m, i) => { const t = tiles[i]; if (!t) return; const pc = (m.hp / m.max * 100).toFixed(1) + '%'; t.fi.style.width = pc; t.tr.style.width = pc; t.fi.style.background = m.hp / m.max < 0.35 ? '#E0524F' : '#6FCB6A'; t.hpn.textContent = Math.round(m.hp) + ' / ' + m.max; });
}
$('abil').addEventListener('click', castAbility);
$('dodge').addEventListener('click', () => tryParry());
stage.addEventListener('pointerdown', () => { if (!tryParry() && abilCd <= 0 && !dodge) { /* taps outside the window do nothing */ } });
iconCanvas(['..w..', '.wtw.', 'wtLtw', '.wtw.', '..w..'], { w: '#E0524F', t: '#FFB3A8', L: '#FFFFFF' }, $('dodgeIc'));

new ResizeObserver(resize).observe(stage);
buildClasses(); setParty(); setAbility(); resize();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => {});
requestAnimationFrame(t => { last = t; frame(t); });
</script>

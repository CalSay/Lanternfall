<title>Orbit Hop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@500;700&display=swap">
<style>
  :root {
    color-scheme: dark;
    --void: #0B1026;
    --void-2: #141a3d;
    --ink: #EDEBFF;
    --dim: #9491C2;
    --gold: #FFE27A;
    --teal: #5CE1C6;
    background: var(--void);
  }
  html { height: 100%; box-sizing: border-box; overflow: hidden; overscroll-behavior: none; }
  body {
    height: 100%; margin: 0; overflow: hidden;
    background: var(--void); color: var(--ink);
    font-family: "Chakra Petch", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #game { position: relative; height: 100%; max-width: 560px; margin: 0 auto; touch-action: none; cursor: pointer; }
  canvas { display: block; width: 100%; height: 100%; }
  .hud {
    position: absolute; inset: 0 0 auto 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 14px 16px; pointer-events: none;
  }
  .hud .label { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); font-weight: 700; }
  #score { font-family: Bungee, "Arial Black", Impact, sans-serif; font-size: 44px; line-height: 1; font-variant-numeric: tabular-nums; }
  #bestHud { font-family: Bungee, "Arial Black", sans-serif; font-size: 18px; color: var(--gold); font-variant-numeric: tabular-nums; }
  .hud .right { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
  #mute {
    pointer-events: auto; width: 40px; height: 40px; border-radius: 50%;
    border: 1.5px solid rgba(237,235,255,.25); background: rgba(11,16,38,.5);
    color: var(--ink); font: 700 12px "Chakra Petch", system-ui, sans-serif; cursor: pointer;
  }
  #mute:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    padding: 24px 16px; text-align: center;
    background: radial-gradient(ellipse at 50% 45%, rgba(11,16,38,.35), rgba(11,16,38,.85));
  }
  .title {
    font-family: Bungee, "Arial Black", Impact, sans-serif; font-size: clamp(48px, 15vw, 76px);
    line-height: .9; margin: 0; letter-spacing: .02em; text-wrap: balance;
    background: linear-gradient(180deg, #FFE27A 0%, #FFB38A 55%, #FF8FB1 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { margin: 0; color: var(--dim); font-size: 15px; max-width: 30ch; line-height: 1.45; }
  .cta {
    margin-top: 10px; font-family: Bungee, "Arial Black", sans-serif; font-size: 18px; letter-spacing: .06em;
    color: var(--void); background: var(--teal); padding: 12px 26px; border-radius: 999px;
    animation: pulse 1.6s ease-in-out infinite;
  }
  .stats { display: flex; gap: 28px; margin: 4px 0 0; }
  .stats div { display: flex; flex-direction: column; gap: 2px; }
  .stats dt { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); font-weight: 700; }
  .stats dd { margin: 0; font-family: Bungee, "Arial Black", sans-serif; font-size: 34px; font-variant-numeric: tabular-nums; }
  .stats .gold { color: var(--gold); }
  .newbest { color: var(--gold); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; font-size: 13px; margin: 0; }
  @keyframes pulse { 50% { transform: scale(1.06); } }
  @media (prefers-reduced-motion: reduce) { .cta { animation: none; } }
</style>

<div id="game">
  <canvas id="cv"></canvas>
  <div class="hud">
    <div>
      <div class="label">Score</div>
      <div id="score">0</div>
    </div>
    <div class="right">
      <button id="mute" type="button" aria-label="Toggle sound">SFX</button>
      <div style="text-align:right">
        <div class="label">Best</div>
        <div id="bestHud">0</div>
      </div>
    </div>
  </div>

  <div class="overlay" id="menu">
    <h1 class="title">ORBIT<br>HOP</h1>
    <p class="sub">Tap to break orbit. Fly into the next planet's ring to get caught. Grab stars for +3.</p>
    <div class="cta">TAP TO PLAY</div>
  </div>

  <div class="overlay" id="over" hidden>
    <h2 class="title" style="font-size:clamp(38px,11vw,56px)">LOST IN<br>SPACE</h2>
    <dl class="stats">
      <div><dt>Score</dt><dd id="finalScore">0</dd></div>
      <div><dt>Best</dt><dd class="gold" id="finalBest">0</dd></div>
    </dl>
    <p class="newbest" id="newBest" hidden>New best</p>
    <div class="cta" id="retry">TAP TO RETRY</div>
  </div>
</div>

<script>
(() => {
  const game = document.getElementById('game');
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);
  const COLORS = ['#FFB38A', '#5CE1C6', '#B79CFF', '#7FB2FF', '#FF8FB1', '#A6E36B'];
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  let W = 0, H = 0, U = 1;
  function resize() {
    const r = game.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = r.width; H = r.height;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    U = Math.max(0.75, Math.min(W, H * 0.62) / 400);
  }
  resize();
  addEventListener('resize', resize);

  // ---------- storage ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  let best = +store.get('orbithop.best', 0) || 0;
  let muted = store.get('orbithop.muted', '0') === '1';
  $('bestHud').textContent = best;
  $('mute').textContent = muted ? 'OFF' : 'SFX';

  // ---------- audio ----------
  let ac = null;
  function sfx(kind) {
    if (muted) return;
    try {
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      const now = ac.currentTime;
      const o = ac.createOscillator(), g = ac.createGain();
      o.connect(g); g.connect(ac.destination);
      const tones = {
        launch: ['triangle', 320, 180, 0.12, 0.10],
        hop:    ['sine', 520 + Math.min(hops, 20) * 25, 880 + Math.min(hops, 20) * 25, 0.18, 0.14],
        star:   ['square', 1200, 1800, 0.12, 0.05],
        die:    ['sawtooth', 220, 50, 0.5, 0.12]
      }[kind];
      o.type = tones[0];
      o.frequency.setValueAtTime(tones[1], now);
      o.frequency.exponentialRampToValueAtTime(tones[2], now + tones[3]);
      g.gain.setValueAtTime(tones[4], now);
      g.gain.exponentialRampToValueAtTime(0.0001, now + tones[3]);
      o.start(now); o.stop(now + tones[3] + 0.02);
    } catch (e) {}
  }
  function buzz(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }

  // ---------- background stars ----------
  const sky = [];
  for (let layer = 0; layer < 3; layer++) {
    for (let i = 0; i < 40; i++) {
      sky.push({ x: Math.random(), y: Math.random(), layer, tw: Math.random() * 6 });
    }
  }

  // ---------- world ----------
  let state = 'menu';
  let planets, pickups, parts, floats, trail, ship, camY, score, hops, flyT, shake, nextI, t = 0, overAt = 0;

  function makePlanet(y, i) {
    const r = (19 + Math.random() * 13) * U * (i > 25 ? 0.85 : 1);
    const ring = r + 34 * U;
    const m = ring + 12 * U;
    const x = m + Math.random() * Math.max(1, W - 2 * m);
    const moving = i > 5 && Math.random() < Math.min(0.65, (i - 5) * 0.06);
    const speed = (35 + Math.random() * 40 + Math.min(i, 40)) * U;
    return {
      x, y, r, ring, i, visited: false,
      color: COLORS[i % COLORS.length],
      vx: moving ? speed * (Math.random() < 0.5 ? -1 : 1) : 0,
      banded: Math.random() < 0.5, tilt: (Math.random() - 0.5) * 0.8
    };
  }

  function spawn() {
    const last = planets[planets.length - 1];
    const gap = (195 + Math.random() * 70 + Math.min(nextI, 40) * 1.6) * U;
    const p = makePlanet(last.y - gap, nextI++);
    planets.push(p);
    if (nextI > 2 && Math.random() < 0.5) {
      pickups.push({
        x: Math.max(20, Math.min(W - 20, (last.x + p.x) / 2 + (Math.random() - 0.5) * 50 * U)),
        y: (last.y + p.y) / 2, got: false, ph: Math.random() * 6
      });
    }
  }

  function reset() {
    planets = []; pickups = []; parts = []; floats = []; trail = [];
    score = 0; hops = 0; flyT = 0; shake = 0; nextI = 1;
    const p0 = makePlanet(0, 0);
    p0.x = W / 2; p0.vx = 0; p0.visited = true;
    planets.push(p0);
    while (planets[planets.length - 1].y > -H * 1.6) spawn();
    ship = { mode: 'orbit', p: p0, a: -Math.PI / 2, dir: 1, x: p0.x, y: p0.y - p0.ring, vx: 0, vy: 0, from: null };
    camY = p0.y - H * 0.68;
    $('score').textContent = 0;
  }

  const omega = () => 2.3 + Math.min(hops, 35) * 0.05;

  function launch() {
    if (ship.mode !== 'orbit') return;
    const S = 560 * U;
    ship.vx = -Math.sin(ship.a) * ship.dir * S;
    ship.vy = Math.cos(ship.a) * ship.dir * S;
    ship.from = ship.p; ship.mode = 'fly'; flyT = 0;
    sfx('launch');
  }

  function capture(p) {
    const rx = ship.x - p.x, ry = ship.y - p.y;
    ship.dir = (rx * ship.vy - ry * ship.vx) >= 0 ? 1 : -1;
    ship.a = Math.atan2(ry, rx);
    ship.mode = 'orbit'; ship.p = p;
    if (!p.visited) {
      p.visited = true; hops++; score++;
      burst(ship.x, ship.y, p.color, 16, 180);
      floatText('+1', ship.x, ship.y - 16, p.color);
      sfx('hop'); buzz(12);
      $('score').textContent = score;
    }
  }

  function die() {
    state = 'over'; ship.mode = 'dead'; overAt = t;
    burst(ship.x, ship.y, '#FFFFFF', 28, 260);
    burst(ship.x, ship.y, '#FF8FB1', 18, 200);
    shake = reduced ? 0 : 14;
    sfx('die'); buzz([30, 40, 60]);
    const isBest = score > best;
    if (isBest) { best = score; store.set('orbithop.best', best); }
    $('bestHud').textContent = best;
    $('finalScore').textContent = score;
    $('finalBest').textContent = best;
    $('newBest').hidden = !isBest || score === 0;
    setTimeout(() => { if (state === 'over') $('over').hidden = false; }, 700);
  }

  function burst(x, y, color, n, spd) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = (0.3 + Math.random()) * spd * U;
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5 + Math.random() * 0.5, max: 1, color });
    }
  }
  function floatText(txt, x, y, color) { floats.push({ txt, x, y, life: 0.9, color }); }

  // ---------- input ----------
  function onPress(e) {
    if (e && e.target === $('mute')) return;
    if (e) e.preventDefault();
    if (state === 'menu') { $('menu').hidden = true; state = 'play'; sfx('launch'); return; }
    if (state === 'over') {
      if (t - overAt < 0.9) return;
      $('over').hidden = true; reset(); state = 'play'; return;
    }
    launch();
  }
  game.addEventListener('pointerdown', onPress);
  addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowUp') { if (document.activeElement === $('mute') && e.code !== 'ArrowUp') return; onPress(e); }
  });
  $('mute').addEventListener('click', e => {
    e.stopPropagation();
    muted = !muted; store.set('orbithop.muted', muted ? '1' : '0');
    $('mute').textContent = muted ? 'OFF' : 'SFX';
  });

  // ---------- update ----------
  function update(dt) {
    t += dt;
    for (const p of planets) {
      if (!p.vx) continue;
      p.x += p.vx * dt;
      const m = p.ring + 6 * U;
      if (p.x < m) { p.x = m; p.vx = Math.abs(p.vx); }
      if (p.x > W - m) { p.x = W - m; p.vx = -Math.abs(p.vx); }
    }

    if (ship.mode === 'orbit') {
      ship.a += ship.dir * omega() * dt;
      ship.x = ship.p.x + Math.cos(ship.a) * ship.p.ring;
      ship.y = ship.p.y + Math.sin(ship.a) * ship.p.ring;
    } else if (ship.mode === 'fly') {
      flyT += dt;
      for (const p of planets) {
        if (p === ship.from) continue;
        const dx = p.x - ship.x, dy = p.y - ship.y, d = Math.hypot(dx, dy);
        const reach = p.ring * 1.9;
        if (d < reach) {
          const acc = 420 * U * (1 - d / reach);
          ship.vx += dx / d * acc * dt; ship.vy += dy / d * acc * dt;
        }
      }
      ship.x += ship.vx * dt; ship.y += ship.vy * dt;
      for (const p of planets) {
        if (p === ship.from) continue;
        if (Math.hypot(ship.x - p.x, ship.y - p.y) < p.ring) { capture(p); break; }
      }
      if (ship.mode === 'fly' && (ship.x < -12 || ship.x > W + 12 || ship.y > camY + H + 24 || flyT > 2.4)) die();
    }

    if (ship.mode !== 'dead') {
      trail.push({ x: ship.x, y: ship.y });
      if (trail.length > 22) trail.shift();
      for (const s of pickups) {
        if (!s.got && Math.hypot(ship.x - s.x, ship.y - s.y) < 24 * U) {
          s.got = true; score += 3; $('score').textContent = score;
          burst(s.x, s.y, '#FFE27A', 12, 140); floatText('+3', s.x, s.y - 14, '#FFE27A'); sfx('star');
        }
      }
    } else if (trail.length) trail.shift();

    // camera
    let target = camY;
    if (ship.mode === 'orbit') target = ship.p.y - H * 0.68;
    else if (ship.mode === 'fly') target = Math.min(camY, ship.y - H * 0.4);
    camY += (target - camY) * Math.min(1, dt * 4);

    while (planets[planets.length - 1].y > camY - H * 0.7) spawn();
    planets = planets.filter(p => p === ship.p || p.y < camY + H + 300);
    pickups = pickups.filter(s => s.y < camY + H + 100 && !(s.got && s.y > camY + H));

    for (const q of parts) { q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 0.96; q.vy *= 0.96; q.life -= dt; }
    parts = parts.filter(q => q.life > 0);
    for (const f of floats) { f.y -= 40 * dt; f.life -= dt; }
    floats = floats.filter(f => f.life > 0);
    shake *= Math.pow(0.02, dt);
  }

  // ---------- render ----------
  function drawSparkle(x, y, r, color, rot) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
    ctx.fillStyle = color; ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const rr = i % 2 ? r * 0.32 : r, a = i * Math.PI / 4;
      ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    ctx.closePath(); ctx.fill(); ctx.restore();
  }

  function render() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#0B1026'); g.addColorStop(1, '#161a44');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    // parallax sky
    for (const s of sky) {
      const f = [0.05, 0.12, 0.25][s.layer];
      let y = (s.y * H - camY * f) % H; if (y < 0) y += H;
      const a = 0.25 + s.layer * 0.2 + Math.sin(t * 2 + s.tw) * 0.12;
      ctx.fillStyle = `rgba(237,235,255,${a})`;
      const sz = 0.8 + s.layer * 0.6;
      ctx.fillRect(s.x * W, y, sz, sz);
    }

    ctx.save();
    if (shake > 0.3) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    ctx.translate(0, -camY);

    // aim guide
    if (ship.mode === 'orbit' && state === 'play') {
      const tx = -Math.sin(ship.a) * ship.dir, ty = Math.cos(ship.a) * ship.dir;
      const len = 150 * U;
      const lg = ctx.createLinearGradient(ship.x, ship.y, ship.x + tx * len, ship.y + ty * len);
      lg.addColorStop(0, 'rgba(237,235,255,.45)'); lg.addColorStop(1, 'rgba(237,235,255,0)');
      ctx.strokeStyle = lg; ctx.lineWidth = 2; ctx.setLineDash([3, 6]); ctx.lineDashOffset = 0;
      ctx.beginPath(); ctx.moveTo(ship.x, ship.y); ctx.lineTo(ship.x + tx * len, ship.y + ty * len); ctx.stroke();
      ctx.setLineDash([]);
    }

    // planets
    for (const p of planets) {
      const current = ship.p === p && ship.mode === 'orbit';
      ctx.save();
      ctx.globalAlpha = current ? 0.9 : p.visited ? 0.2 : 0.45;
      ctx.strokeStyle = p.color; ctx.lineWidth = current ? 2 : 1.5;
      ctx.setLineDash([4 * U, 7 * U]); ctx.lineDashOffset = -t * 18;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.ring, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();

      ctx.save();
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = p.color; ctx.fill();
      ctx.clip();
      if (p.banded) {
        ctx.save();
        ctx.translate(p.x, p.y); ctx.rotate(p.tilt);
        ctx.fillStyle = 'rgba(11,16,38,.16)';
        ctx.fillRect(-p.r * 1.3, -p.r * 0.35, p.r * 2.6, p.r * 0.22);
        ctx.fillRect(-p.r * 1.3, p.r * 0.2, p.r * 2.6, p.r * 0.14);
        ctx.restore();
      } else {
        ctx.fillStyle = 'rgba(11,16,38,.14)';
        ctx.beginPath(); ctx.arc(p.x + p.r * 0.3, p.y - p.r * 0.2, p.r * 0.22, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(p.x - p.r * 0.35, p.y + p.r * 0.35, p.r * 0.14, 0, Math.PI * 2); ctx.fill();
      }
      const sh = ctx.createRadialGradient(p.x - p.r * 0.45, p.y - p.r * 0.45, p.r * 0.1, p.x, p.y, p.r * 1.15);
      sh.addColorStop(0, 'rgba(255,255,255,.35)'); sh.addColorStop(0.45, 'rgba(255,255,255,0)'); sh.addColorStop(1, 'rgba(11,16,38,.55)');
      ctx.fillStyle = sh; ctx.fillRect(p.x - p.r, p.y - p.r, p.r * 2, p.r * 2);
      ctx.restore();
    }
    // pickups
    for (const s of pickups) {
      if (s.got) continue;
      const bob = Math.sin(t * 3 + s.ph) * 3 * U;
      const glow = ctx.createRadialGradient(s.x, s.y + bob, 0, s.x, s.y + bob, 18 * U);
      glow.addColorStop(0, 'rgba(255,226,122,.45)'); glow.addColorStop(1, 'rgba(255,226,122,0)');
      ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(s.x, s.y + bob, 18 * U, 0, Math.PI * 2); ctx.fill();
      drawSparkle(s.x, s.y + bob, 10 * U, '#FFE27A', t * 1.5 + s.ph);
    }

    // trail
    for (let i = 1; i < trail.length; i++) {
      const k = i / trail.length;
      ctx.strokeStyle = `rgba(92,225,198,${k * 0.6})`;
      ctx.lineWidth = 1 + k * 4 * U; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(trail[i - 1].x, trail[i - 1].y); ctx.lineTo(trail[i].x, trail[i].y); ctx.stroke();
    }

    // ship
    if (ship.mode !== 'dead') {
      const sg = ctx.createRadialGradient(ship.x, ship.y, 0, ship.x, ship.y, 16 * U);
      sg.addColorStop(0, 'rgba(92,225,198,.7)'); sg.addColorStop(1, 'rgba(92,225,198,0)');
      ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(ship.x, ship.y, 16 * U, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#FFFFFF'; ctx.beginPath(); ctx.arc(ship.x, ship.y, 5 * U, 0, Math.PI * 2); ctx.fill();
      if (ship.mode === 'fly' && flyT > 1.4) {
        ctx.strokeStyle = `rgba(255,143,177,${0.5 + 0.5 * Math.sin(t * 20)})`; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(ship.x, ship.y, 10 * U, 0, Math.PI * 2); ctx.stroke();
      }
    }

    for (const q of parts) {
      ctx.globalAlpha = Math.max(0, q.life);
      ctx.fillStyle = q.color; ctx.fillRect(q.x - 1.5, q.y - 1.5, 3, 3);
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'center';
    ctx.font = `${Math.round(20 * U)}px Bungee, "Arial Black", sans-serif`;
    for (const f of floats) {
      ctx.globalAlpha = Math.min(1, f.life * 1.5); ctx.fillStyle = f.color; ctx.fillText(f.txt, f.x, f.y);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  // ---------- loop ----------
  reset();
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000); last = now;
    update(dt); render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

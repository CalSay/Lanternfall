name: ci
on:
  pull_request:
    branches: [claude/elegant-johnson-m6k00u]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [claude/elegant-johnson-m6k00u]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The full check runs as four shards on four runners (the same --shard=i/4 split check.mjs uses locally), so it costs
  # a quarter of the time. Each shard builds, then runs its slice; shard 0 also checks that dist is committed rebuilt.
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20   # room for one retry of a shard
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Runner image (part of the Playwright cache key)
        id: image
        run: echo "os=$ImageOS" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.image.outputs.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - name: Build
        run: node tools/build.mjs
      - name: dist is committed rebuilt
        if: matrix.shard == 0
        run: |
          if ! git diff --exit-code -- dist/lanternfall.html; then
            echo "::error::node tools/build.mjs changed dist/lanternfall.html. Commit the rebuilt dist."
            exit 1
          fi
      - name: Check shard ${{ matrix.shard }}/4 (no browser section may be skipped)
        env:
          NODE_OPTIONS: --max-old-space-size=4096   # a check shard hit the 2 GB default heap limit on the runner
        run: |
          # One automatic retry (tools/ci/retry-once.sh): a pass on the second go shows as a FLAKE warning and in the job
          # summary, a second failure fails the job. Never skip or quarantine a check to get green.
          RETRY_LOG=check.log tools/ci/retry-once.sh "check shard ${{ matrix.shard }}/4" node tools/check.mjs --shard=${{ matrix.shard }}/4 || exit $?
          grep -q '^browser sections skipped: 0 ' check.log || { echo "::error::a browser section was skipped"; exit 1; }

  # Offline parity needs no browser, so it runs beside the checks.
  offline-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tools/offline-parity.mjs

  # Report only (it never gated), so it gets its own runner and stays off the critical path.
  perf:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Runner image (part of the Playwright cache key)
        id: image
        run: echo "os=$ImageOS" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.image.outputs.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: node tools/build.mjs
      # The budgets are wall-clock timings tuned on a fast machine; on a shared runner the same build misses them
      # (first frame ~2.5 s vs 1.5 s), so this reports and does not gate.
      - name: Perf (quick, report only)
        continue-on-error: true
        run: node tools/perf.mjs --quick

  # SIM-TARGETS: the health bots play the real game and are scored against docs/design/health-baseline.json. A balance
  # change that moves a number past its tolerance fails here; accept it by running --write-baseline in the same PR.
  # Its own job, so it runs beside the checks and adds nothing to their time.
  health:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Health (casual, active, optimiser)
        run: node tools/health.mjs --compare

  # Report only until its bands have held for a few merges; its own job so the 150 s run is off the critical path.
  health-long:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Health, 50-hour run (report only)
        continue-on-error: true
        run: node tools/health.mjs --long --compare

  path-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Protected paths need the cal-approved label
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: tools/ci/path-guard.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" "$LABELS"

  # EYES: the robot plays the change like a player. Replays every docs/proof/<card>/route.txt this PR changed on the built
  # game (portrait and landscape), uploads shots and bursts, posts one PR comment. A failed `expect` fails the job. A PR
  # that changes src/ with no changed route.txt fails unless it has the `no-visible-change` label.
  eyes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15   # room for one retry
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Lean on minutes: nothing below runs unless this PR touches src/ or a proof route.
      - name: Does this PR need eyes?
        id: gate
        run: node tools/ci/eyes.mjs --gate "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.gate.outputs.go == 'true'
        run: npm ci
      - name: Runner image (part of the Playwright cache key)
        if: steps.gate.outputs.go == 'true'
        id: image
        run: echo "os=$ImageOS" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browser
        if: steps.gate.outputs.go == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.image.outputs.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.gate.outputs.go == 'true'
        run: npx playwright install --with-deps chromium
      - name: Build the merge result
        if: steps.gate.outputs.go == 'true'
        run: node tools/build.mjs
      - name: Play the routes
        if: steps.gate.outputs.go == 'true'
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: RETRY_LOG=eyes.log tools/ci/retry-once.sh "eyes routes" node tools/ci/eyes.mjs "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" "$LABELS"
      - name: Upload shots
        if: always() && steps.gate.outputs.go == 'true'
        id: up
        uses: actions/upload-artifact@v4
        with:
          name: eyes-out
          path: eyes-out/
          retention-days: 14
      - name: Comment on the PR
        if: always() && steps.gate.outputs.go == 'true' && hashFiles('eyes-out/summary.md') != ''
        uses: actions/github-script@v7
        env:
          ART_URL: ${{ steps.up.outputs.artifact-url }}
        with:
          script: |
            const fs = require('fs');
            let body = fs.readFileSync('eyes-out/summary.md', 'utf8');
            if (process.env.ART_URL) body += `\n[Open the shots](${process.env.ART_URL})\n`;
            const { owner, repo } = context.repo, issue_number = context.issue.number;
            const all = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = all.find(c => c.body && c.body.includes('<!-- lanternfall-eyes -->'));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

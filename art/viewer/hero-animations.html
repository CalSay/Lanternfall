<title>Hero Animation Test</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Handjet:wght@500;700&family=Barlow+Semi+Condensed:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#13121d; --panel:#1b1a29; --line:#2c2a40; --text:#ebe5f2; --muted:#a39bb8;
  --violet:#9a66d6; --gold:#e2aa3e; --stage:#1a1c2c;
  --display:"Handjet","Arial Narrow",monospace; --body:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
}
html,body{background:var(--bg);color:var(--text)}
body{font-family:var(--body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:24px 40px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:700;font-size:44px;line-height:1;letter-spacing:.02em;margin:0;text-wrap:balance}
h1 span{color:var(--gold)}
.sub{color:var(--muted);margin:6px 0 0;max-width:62ch}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button,.btn{font:600 14px var(--body);color:var(--text);background:var(--panel);border:0;padding:8px 12px;cursor:pointer;letter-spacing:.02em}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--violet);color:#fff}
.btn{border:1px solid var(--line);border-radius:6px}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:16px}
figure{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column}
.stage{background:var(--stage);border-radius:8px 8px 0 0;display:flex;align-items:center;justify-content:center;overflow:auto;min-height:230px;padding:8px}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;max-width:100%}
figcaption{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:10px 14px}
figcaption b{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:.03em}
figcaption small{color:var(--muted);font-variant-numeric:tabular-nums}
.note{color:var(--muted);font-size:14px;max-width:70ch;margin:0}
</style>
<div class="wrap">
  <header>
    <div>
      <h1 id="hname">Wren <span>Hollowmere</span></h1>
      <p class="sub" id="hnote"></p>
    </div>
    <div class="bar">
      <span class="lbl">Hero</span>
      <div class="seg" id="heroes" role="group" aria-label="Hero"><button id="h-wren" data-h="wren">Wren</button><button id="h-tobin" data-h="tobin">Tobin</button><button id="h-pip" data-h="pip">Pip</button></div>
      <span class="lbl">Size</span>
      <div class="seg" id="size" role="group" aria-label="Size">
        <button id="s1" data-s="1">1×</button><button id="s2" data-s="2" aria-pressed="true">2×</button><button id="s3" data-s="3">3×</button>
      </div>
      <span class="lbl">Speed</span>
      <div class="seg" id="speed" role="group" aria-label="Speed">
        <button id="v05" data-v="0.5">½</button><button id="v1" data-v="1" aria-pressed="true">1</button>
      </div>
      <button class="btn" id="play">Pause</button>
    </div>
  </header>
  <div class="grid" id="grid"></div>
  <p class="note">1× is roughly how big she would look on the stage if we draw her at the finer scale (one art pixel per screen point). The game today draws art at 2×.</p>
</div>

let hero=(()=>{try{return localStorage.getItem("hero")||"wren"}catch(e){return "wren"}})(); if(!A[hero])hero="wren";
let scale=2, speed=1, playing=true;
let tiles=[];
const grid=document.getElementById("grid");
function build(){
  grid.innerHTML="";tiles=[];
  const H=A[hero];
  const parts=H.full.split(" ");
  document.getElementById("hname").innerHTML=parts[0]+" <span>"+parts.slice(1).join(" ")+"</span>";
  document.getElementById("hnote").textContent=H.note+" Idles loop; the rest replay after a short pause.";
  for(const [k,name] of H.order){
    const a=H.anims[k], img=new Image(); img.src=a.src;
    const fig=document.createElement("figure");
    fig.innerHTML='<div class="stage"><canvas></canvas></div><figcaption><b></b><small></small></figcaption>';
    fig.querySelector("b").textContent=name;
    grid.appendChild(fig);
    const cv=fig.querySelector("canvas"), cap=fig.querySelector("small");
    const T={a,img,cv,ctx:cv.getContext("2d"),cap,f:0,t:0,wait:0}; tiles.push(T); img.onload=()=>draw(T);
  }
  for(const bt of document.querySelectorAll("#heroes button"))bt.setAttribute("aria-pressed",bt.dataset.h===hero?"true":"false");
  size();
}
function size(){for(const T of tiles){T.cv.width=T.a.w*scale;T.cv.height=T.a.h*scale;T.ctx.imageSmoothingEnabled=false;draw(T)}}
function draw(T){const {a,ctx}=T;ctx.clearRect(0,0,T.cv.width,T.cv.height);if(!T.img.complete)return;ctx.drawImage(T.img,T.f*a.w,0,a.w,a.h,0,0,a.w*scale,a.h*scale);T.cap.textContent=`frame ${String(T.f+1).padStart(2,"0")} / ${a.n} · ${a.loop?"loops":"plays once"}`}
let last=performance.now();
function tick(now){
  const dt=(now-last)*speed; last=now;
  if(playing)for(const T of tiles){
    if(T.wait>0){T.wait-=dt;if(T.wait<=0){T.f=0;draw(T)}continue}
    T.t+=dt;
    while(T.t>=T.a.ms){T.t-=T.a.ms;
      if(T.f<T.a.n-1)T.f++;else if(T.a.loop)T.f=0;else{T.wait=T.a.n>=16?1600:900;T.t=0;break}
      draw(T)}
  }
  requestAnimationFrame(tick);
}
function pick(group,attr,btn){for(const b of group.querySelectorAll("button"))b.setAttribute("aria-pressed",b===btn?"true":"false")}
document.getElementById("size").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;scale=+b.dataset.s;pick(e.currentTarget,"s",b);size()});
document.getElementById("speed").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;speed=+b.dataset.v;pick(e.currentTarget,"v",b)});
const pb=document.getElementById("play");
pb.addEventListener("click",()=>{playing=!playing;pb.textContent=playing?"Pause":"Play"});
if(matchMedia("(prefers-reduced-motion: reduce)").matches){playing=false;pb.textContent="Play"}
document.getElementById("heroes").addEventListener("click",e=>{const bt=e.target.closest("button");if(!bt)return;hero=bt.dataset.h;try{localStorage.setItem("hero",hero)}catch(err){}build()});
build();requestAnimationFrame(tick);
</script>

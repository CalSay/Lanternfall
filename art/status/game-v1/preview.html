<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lanternfall status icons</title><style>*{box-sizing:border-box}body{background:#17191e;color:#f2e8cf;font:15px system-ui;margin:0}main{max-width:1100px;padding:30px 20px;margin:auto}h1{font:34px Georgia}p{color:#b5b6bd;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{background:#24272e;border:1px solid #454950;padding:20px;border-radius:10px;text-align:center}h2{font:21px Georgia;margin:10px}.samples{display:flex;align-items:end;justify-content:center;gap:22px;height:92px}canvas{image-rendering:pixelated}small{display:block;font-size:11px;color:#a3a5ad;margin-top:8px}.card p{font-size:12px;min-height:36px}.badge{color:#d2b17b}a{color:#dec494}@media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.samples{gap:8px}.card{padding:12px;min-width:0}}@media(max-width:380px){.grid{grid-template-columns:1fr}}</style><main><span class="badge">LANTERNFALL · APPROVED STATUS ICONS</span><h1>Read the fight at a glance</h1><p>Fifteen shared statuses for the new ability trees. Native PNG exports shown at 16, 24 and 64 pixels. The pack also includes 32, 36 and 48 pixels. Ward uses a rounded barrier to distinguish it from Frozen's solid ice.</p><div id="grid" class="grid"></div><p id="status">Loading…</p></main><script src="manifest.js"></script><script>Promise.all(STATUS_ICONS.map(async icon=>{const el=document.createElement('article');el.className='card';const samples=document.createElement('div');samples.className='samples';for(const size of [16,24,64]){const wrap=document.createElement('div'),c=document.createElement('canvas'),label=document.createElement('small');c.width=c.height=size;c.setAttribute('aria-label',icon.name+' at '+size+' pixels');const ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;const im=new Image;im.src=icon.name.toLowerCase()+"-"+size+".png";await im.decode();ctx.drawImage(im,0,0);label.textContent=size+'px';wrap.append(c,label);samples.append(wrap)}const title=document.createElement('h2'),note=document.createElement('p');title.textContent=icon.name;note.textContent=icon.note;el.append(samples,title,note);return el})).then(cards=>{document.getElementById('grid').append(...cards);document.getElementById('status').textContent='15 / 15 approved designs · 90 game-ready PNGs';window.previewReady=true}).catch(e=>document.getElementById('status').textContent=e.message)</script></html>

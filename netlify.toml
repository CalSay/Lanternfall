# Netlify (the testers' web build, https://lanternfall.netlify.app). tools/site.mjs wraps the committed
# dist/lanternfall.html into site/ (no npm install).
#
# Deploys are rationed (owner, 2026-10-05): Netlify skips every push unless the newest commit message
# contains "[deploy]". Autopilot adds it once a week, at 00:00 UK on Monday, and only when something new has
# merged since the last deploy and the build is green.
# `ignore` exits 0 to skip the build and 1 to build.
[build]
  command = "node tools/site.mjs site"
  publish = "site"
  ignore = "git log -1 --pretty=%B | grep -qF '[deploy]' && exit 1 || exit 0"

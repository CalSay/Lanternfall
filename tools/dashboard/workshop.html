<title>Lanternfall Workshop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;600;700&family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: #140F1A;
    --panel: #1F1827;
    --well: #110D16;
    --line: #3A2F47;
    --bone: #EFE6D6;
    --muted: #A597B4;
    --ember: #FF9E3D;
    --ember-deep: #B8621B;
    --run: #F2C14E;
    --done: #6FCB6A;
    --review: #5FA8FF;
    --block: #E0524F;
    --queued: #6E6480;
    --display: "Pixelify Sans", "Courier New", monospace;
    --body: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
    background: var(--bg);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background-color: var(--bg); color: var(--bone);
    background-image: radial-gradient(rgba(255,255,255,.028) 1px, transparent 1px); background-size: 4px 4px;
    font: 15px/1.45 var(--body);
  }
  .wrap { max-width: 880px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 40px; display: grid; gap: 22px; }

  header { display: grid; gap: 4px; }
  .eyebrow { font: 600 12px var(--body); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .eyebrow::before { content: ""; width: 7px; height: 7px; background: var(--ember); box-shadow: 0 0 8px rgba(255,158,61,.7); }
  h1 { margin: 0; font: 700 clamp(28px, 6vw, 40px)/1.05 var(--display); text-shadow: 0 3px 0 #0B0810; text-wrap: balance; }
  .headline { margin: 4px 0 0; color: var(--muted); max-width: 62ch; }
  .live { font: 500 12px var(--mono); color: var(--muted); }
  .live i { display: inline-block; width: 7px; height: 7px; background: var(--queued); margin-right: 6px; vertical-align: 1px; }
  .live.on i { background: var(--done); box-shadow: 0 0 6px var(--done); }

  .top { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 12px; }
  @media (max-width: 620px) { .top { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 2px solid var(--line); box-shadow: inset 0 1px 0 rgba(255,255,255,.04), 0 3px 0 #0B0810; padding: 16px; display: grid; gap: 10px; align-content: start; }
  .label { font: 600 11px var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .clock { font: 700 clamp(44px, 11vw, 64px)/1 var(--display); font-variant-numeric: tabular-nums; color: var(--ember); text-shadow: 0 3px 0 #0B0810; }
  .clock.late { color: var(--block); }
  .sub { font-size: 13px; color: var(--muted); }
  .burn { height: 10px; background: var(--well); border: 2px solid #0B0810; position: relative; }
  .burn > i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, var(--ember-deep), var(--ember)); }
  .pct { font: 700 44px/1 var(--display); font-variant-numeric: tabular-nums; }
  .pct small { font-size: 18px; color: var(--muted); }
  .bar { height: 10px; background: var(--well); border: 2px solid #0B0810; display: flex; overflow: hidden; }
  .bar i { height: 100%; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend b { color: var(--bone); font: 600 14px var(--display); font-variant-numeric: tabular-nums; }
  .sw { width: 9px; height: 9px; display: inline-block; }

  .phases { display: grid; gap: 18px; }
  .phase { display: grid; gap: 8px; }
  .phase-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .phase-head h2 { margin: 0; font: 600 19px var(--display); }
  .phase-head .count { font: 500 12px var(--mono); color: var(--muted); }
  .task { display: grid; grid-template-columns: 6px 1fr auto; gap: 0 12px; background: var(--panel); border: 2px solid var(--line); box-shadow: 0 2px 0 #0B0810; }
  .task .stripe { background: var(--queued); }
  .task .body { padding-block: 10px; min-width: 0; display: grid; gap: 3px; }
  .task .title { font: 600 16px/1.25 var(--display); }
  .task .meta { font: 500 12px var(--mono); color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
  .task .note { font-size: 14px; color: var(--muted); }
  .task .right { padding: 10px 12px 10px 0; display: grid; justify-items: end; align-content: start; gap: 6px; }
  .pill { font: 600 11px var(--body); letter-spacing: .12em; text-transform: uppercase; padding: 3px 8px; border: 2px solid #0B0810; color: #140F1A; background: var(--queued); white-space: nowrap; }
  .s-running .stripe, .s-running .pill { background: var(--run); }
  .s-review .stripe, .s-review .pill { background: var(--review); }
  .s-done .stripe, .s-done .pill { background: var(--done); }
  .s-blocked .stripe, .s-blocked .pill { background: var(--block); color: #fff; }
  .s-cut .stripe, .s-cut .pill { background: #3A3342; color: var(--muted); }
  .s-cut .title { text-decoration: line-through; color: var(--muted); }
  .s-queued .pill { color: var(--bone); }
  .s-running .stripe { animation: glow 1.4s ease-in-out infinite; }
  @keyframes glow { 50% { opacity: .45; } }

  .log { display: grid; gap: 0; background: var(--well); border: 2px solid var(--line); }
  .log-row { display: grid; grid-template-columns: 58px 1fr; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 14px; }
  .log-row:last-child { border-bottom: 0; }
  .log-row time { font: 500 12px var(--mono); color: var(--muted); padding-top: 2px; }
  .log-row.k-ship { color: var(--done); }
  .log-row.k-warn { color: #FFB27A; }
  .empty { padding: 14px; color: var(--muted); font-size: 14px; margin: 0; }
  a { color: var(--ember); }
  a:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
  .links { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 14px; }
  @media (prefers-reduced-motion: reduce) { .s-running .stripe { animation: none; } }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">Build board · single-player sprint</div>
    <h1>Lanternfall Workshop</h1>
    <p class="headline" id="headline">Claude agents are working on the game. This page updates live as tasks move.</p>
    <div class="live" id="live"><i></i>Connecting to the board...</div>
  </header>

  <section class="top" aria-label="Summary">
    <div class="card">
      <span class="label">Time until you test</span>
      <div class="clock" id="clock">--:--</div>
      <div class="burn"><i id="burn" style="width:0%"></i></div>
      <span class="sub" id="deadlineSub">Deadline loading...</span>
    </div>
    <div class="card">
      <span class="label">Work finished</span>
      <div class="pct" id="pct">0<small>%</small></div>
      <div class="bar" id="bar"></div>
      <div class="legend" id="legend"></div>
    </div>
  </section>

  <section class="phases" id="phases" aria-label="Tasks by phase">
    <p class="empty">Loading tasks...</p>
  </section>

  <section class="sec" aria-label="Activity">
    <div class="phase-head" style="margin-bottom:8px"><h2>Activity</h2><span class="count">latest first</span></div>
    <div class="log" id="log"><p class="empty">No activity yet.</p></div>
  </section>

  <div class="links" id="links"></div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const el = (t, c, txt) => { const e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e; };
  const STATUS = ['done', 'review', 'running', 'queued', 'blocked', 'cut'];
  const STATUS_LABEL = { done: 'Done', review: 'In review', running: 'Working', queued: 'Queued', blocked: 'Blocked', cut: 'Cut' };
  const STATUS_COL = { done: 'var(--done)', review: 'var(--review)', running: 'var(--run)', queued: 'var(--queued)', blocked: 'var(--block)', cut: '#3A3342' };
  let meta = null, tasks = [], logs = [];

  const hhmm = ms => new Date(ms).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  function ago(ms) {
    const s = Math.max(0, (Date.now() - ms) / 1000);
    if (s < 60) return 'just now';
    if (s < 3600) return Math.floor(s / 60) + ' min ago';
    return Math.floor(s / 3600) + ' h ago';
  }

  function renderClock() {
    if (!meta || !meta.deadline) return;
    const left = meta.deadline - Date.now();
    const span = meta.deadline - (meta.startedAt || meta.deadline - 3600000);
    const c = $('clock');
    if (left <= 0) { c.textContent = meta.done ? 'Ready' : '0:00'; c.classList.toggle('late', !meta.done); }
    else { const m = Math.floor(left / 60000), s = Math.floor(left % 60000 / 1000); c.textContent = `${m}:${String(s).padStart(2, '0')}`; c.classList.remove('late'); }
    $('burn').style.width = Math.min(100, Math.max(0, (1 - left / span) * 100)) + '%';
    $('deadlineSub').textContent = `Test build due at ${hhmm(meta.deadline)}` + (meta.publishedVersion ? ` · game is on version ${meta.publishedVersion}` : '');
  }

  function renderSummary() {
    const live = tasks.filter(t => t.status !== 'cut');
    const counts = Object.fromEntries(STATUS.map(s => [s, tasks.filter(t => t.status === s).length]));
    const pct = live.length ? Math.round(counts.done / live.length * 100) : 0;
    $('pct').firstChild.nodeValue = pct;
    const bar = $('bar'); bar.textContent = '';
    for (const s of ['done', 'review', 'running', 'blocked', 'queued']) {
      if (!counts[s] || !live.length) continue;
      const i = el('i'); i.style.width = (counts[s] / live.length * 100) + '%'; i.style.background = STATUS_COL[s]; bar.append(i);
    }
    const lg = $('legend'); lg.textContent = '';
    for (const s of STATUS) {
      if (!counts[s]) continue;
      const sp = el('span'); const sw = el('i', 'sw'); sw.style.background = STATUS_COL[s];
      sp.append(sw, el('b', null, String(counts[s])), document.createTextNode(STATUS_LABEL[s]));
      lg.append(sp);
    }
  }

  function renderTasks() {
    const box = $('phases'); box.textContent = '';
    if (!tasks.length) { box.append(el('p', 'empty', 'No tasks on the board yet.')); return; }
    const phases = new Map();
    for (const t of tasks.slice().sort((a, b) => (a.phaseOrder || 0) - (b.phaseOrder || 0) || (a.order || 0) - (b.order || 0))) {
      if (!phases.has(t.phase)) phases.set(t.phase, []);
      phases.get(t.phase).push(t);
    }
    for (const [name, list] of phases) {
      const sec = el('div', 'phase');
      const head = el('div', 'phase-head');
      const done = list.filter(t => t.status === 'done').length, live = list.filter(t => t.status !== 'cut').length;
      head.append(el('h2', null, name || 'Tasks'), el('span', 'count', `${done}/${live} done`));
      sec.append(head);
      for (const t of list) {
        const st = STATUS.includes(t.status) ? t.status : 'queued';
        const row = el('div', 'task s-' + st);
        const body = el('div', 'body');
        body.append(el('div', 'title', t.title || 'Untitled task'));
        const meta = el('div', 'meta');
        if (t.agent) meta.append(el('span', null, t.agent));
        if (t.updatedAt) meta.append(el('span', null, 'updated ' + ago(t.updatedAt)));
        if (meta.childNodes.length) body.append(meta);
        if (t.note) body.append(el('div', 'note', t.note));
        const right = el('div', 'right'); right.append(el('span', 'pill', STATUS_LABEL[st]));
        row.append(el('div', 'stripe'), body, right);
        sec.append(row);
      }
      box.append(sec);
    }
  }

  function renderLog() {
    const box = $('log'); box.textContent = '';
    const list = logs.slice().sort((a, b) => (b.at || 0) - (a.at || 0)).slice(0, 20);
    if (!list.length) { box.append(el('p', 'empty', 'No activity yet.')); return; }
    for (const l of list) {
      const r = el('div', 'log-row' + (l.kind ? ' k-' + l.kind : ''));
      r.append(el('time', null, l.at ? hhmm(l.at) : ''), el('span', null, l.text || ''));
      box.append(r);
    }
  }

  function renderMeta() {
    if (!meta) return;
    if (meta.headline) $('headline').textContent = meta.headline;
    const links = $('links'); links.textContent = '';
    if (meta.gameUrl) {
      const a = el('a', null, 'Open the game'); a.href = meta.gameUrl; a.target = '_blank'; a.rel = 'noopener';
      links.append(a);
    }
    renderClock();
  }

  function renderAll() { renderMeta(); renderSummary(); renderTasks(); renderLog(); }
  setInterval(() => { renderClock(); }, 1000);
  setInterval(() => { renderTasks(); }, 30000);

  (async () => {
    const cl = window.claude && typeof window.claude.use === 'function' ? window.claude : null;
    let db = null;
    try { db = cl ? await cl.use('db') : null; } catch (e) { db = null; }
    if (!db) { $('live').innerHTML = '<i></i>Open this page from its Claude link to see live progress.'; return; }
    const onErr = () => { $('live').className = 'live'; $('live').lastChild.nodeValue = 'Connection lost. Reload to reconnect.'; };
    const mark = () => { $('live').className = 'live on'; $('live').lastChild.nodeValue = 'Live · updated ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }); };
    db.doc('meta/project').onSnapshot(s => { meta = s.exists ? s.data() : null; mark(); renderMeta(); }, onErr);
    db.collection('tasks').onSnapshot(q => { tasks = q.docs.map(d => ({ id: d.id, ...d.data() })); mark(); renderSummary(); renderTasks(); }, onErr);
    db.collection('log').orderBy('at', 'desc').limit(20).onSnapshot(q => { logs = q.docs.map(d => ({ id: d.id, ...d.data() })); mark(); renderLog(); }, onErr);
  })();
})();
</script>
